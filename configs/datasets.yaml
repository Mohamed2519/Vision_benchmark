datasets:

  chexpert:
    val_test:
      csv:
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/chexpert/cleaned_data_v3/splits/valid.csv
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/chexpert/cleaned_data_v3/splits/valid.csv
      image_root: null          # set to null if CSV has absolute paths
    golden:
      images_dir:      /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/chexpert/golden_images
      annotations_dir: /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/chexpert/golden_labels

  mimic:
    val_test:
      csv:
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/mimic/cleaned_data_v3/splits/valid.csv
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/mimic/cleaned_data_v3/splits/test.csv
      image_root: null
    golden:
      images_dir:      null
      annotations_dir: null 


  nih:
    val_test:
      csv:
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/nih/cleaned_data_v3/splits/valid.csv
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/nih/cleaned_data_v3/splits/test.csv
      image_root: null
    golden:
      images_dir:      "/mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/nih/golden_images"
      annotations_dir: "/mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/nih/golden_labels"

  dataset4:
    padchest:
      csv:
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/padchest/padchest_cleaned_data_v3/splits/valid.csv
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/padchest/padchest_cleaned_data_v3/splits/test.csv
      image_root: null
    golden:
      images_dir:      /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/padchest/golden_images_padchest
      annotations_dir: /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/padchest/golden_labels_padchest

  vindr:
    val_test:
      csv:
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/vindr/vindr_cleaned_data_v2/splits/valid.csv
        - /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/vindr/vindr_cleaned_data_v2/splits/test.csv
      image_root: null
    golden:
      images_dir:      /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/vindr/golden_images_vindr
      annotations_dir: /mnt/nvme/echonova-vision/dev/pathology_binary_classifier/dataset/vindr/golden_labels_vindr
