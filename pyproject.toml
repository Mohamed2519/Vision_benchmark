[project]
name = "pathology-binary-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.30.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "wandb>=0.23.1",
    "pillow>=12.1.0",
    "pydicom>=3.0.1",
    "opencv-python>=4.11.0.86",
    "cleanlab>=2.9.0",
    "torchxrayvision>=1.4.0",
    "h5py>=3.16.0",
    "ftfy>=6.3.1",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
# Only use this index for torch-related packages
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
